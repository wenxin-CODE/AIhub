services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: starops-backend
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - STAROPS_DEBUG=0
    # 容器内不挂载 .env（避免 Key 进镜像层），改由宿主 .env 经变量透传：
    #   cp .env.example .env  →  填入 Key  →  docker compose up
    # compose 会自动读取同目录的 .env 做变量替换。
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: starops-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
